[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jwst-vmpt"
version = "1.8.0"
description = "Visual MSA Planning Tool — interactive Bokeh app for JWST/NIRSpec MSA shutter configuration, with hMPT-derived pointing optimization and shutter-collision protection."
readme = "README.md"
# PEP 639 SPDX license expression. The OLD table form
# (`license = { text = "MIT" }`) plus the
# `License :: OSI Approved :: MIT License` classifier was rejected
# by TestPyPI / PyPI's Warehouse with a generic 400 Bad Request when
# Metadata-Version 2.4 is emitted — Warehouse now enforces "SPDX
# expression OR classifier, not both."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fengwu Sun" },
]
keywords = ["JWST", "NIRSpec", "MSA", "MPT", "eMPT", "astronomy", "spectroscopy"]
requires-python = ">=3.10"
classifiers = [
    # NB: PyPI enforces a strict whitelist of classifiers (see
    # https://pypi.org/classifiers/). `Framework :: Bokeh` is NOT on
    # it — Warehouse rejects the upload with a 400 if it's present.
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "astropy>=5.0",
    "bokeh>=3.7",
    # vMPT imports `crds` directly (vmpt.msa.ensure_current_operability) to
    # refresh the MSA operability reference on startup. It already arrives
    # transitively via `jwst`, but a package should declare its direct
    # imports. NOTE: this only makes the auto-update *possible* — fetching the
    # latest msaoper still needs network access to jwst-crds.stsci.edu and a
    # writable cache; the bundled snapshot (vmpt/data/msaoper_fallback.npz) is
    # what guarantees the map loads offline / on a fresh install.
    "crds>=11",
    "jwst>=1.18",
    "jwst_gtvt>=1.0",
    # Colormaps for grayscale-FITS display (vmpt.image_io._apply_colormap).
    # Only imported when a non-gray colormap is selected; almost always already
    # present transitively via astropy/jwst.
    "matplotlib>=3.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=9.0",
    "pysiaf>=0.20",
    # DS9 region (.reg) parsing for the region/contour display layers (v1.8.0).
    "regions>=0.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
# `vmpt` opens the Bokeh app in a browser.
# `vmpt examples download` fetches the optional example datasets.
vmpt = "vmpt.cli:main"

[project.urls]
Homepage      = "https://github.com/fengwusun/vMPT"
Source        = "https://github.com/fengwusun/vMPT"
Issues        = "https://github.com/fengwusun/vMPT/issues"
Changelog     = "https://github.com/fengwusun/vMPT/blob/main/CHANGELOG.md"
Documentation = "https://vmpt.readthedocs.io/"

[tool.setuptools]
# Explicit package list — `examples/` and `tests/` are NOT included.
# The two .npz files in vmpt/data/ are required at runtime.
packages = ["vmpt"]

[tool.setuptools.package-data]
# Ship the MSA grid + per-shutter dispersion table alongside the
# Python modules. Without these vMPT can't render the MSA overlay.
vmpt = ["data/*.npz", "static/**/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
