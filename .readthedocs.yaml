# Read the Docs configuration. https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py
  # Treat warnings non-fatally for now — turn on later once the
  # autodoc cross-references stop producing the inevitable "first
  # build" noise.
  fail_on_warning: false

python:
  install:
    # First: documentation tooling (sphinx, myst-parser, furo, …).
    - requirements: docs/requirements.txt
    # Then: vMPT itself so autodoc can import the package.
    # Heavy native deps (jwst, pysiaf, jwst_gtvt, …) are mocked
    # via `autodoc_mock_imports` in docs/conf.py — the editable
    # install only needs to satisfy the Python-package wiring.
    - method: pip
      path: .
