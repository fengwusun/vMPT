  <style>
    /* Make the document fill the viewport so Bokeh's sizing_mode='stretch_both'
       on the root layout actually has a finite parent to stretch into.
       Bokeh's default body styles set display:flow-root with no fixed
       height, which collapses any stretch-both child to its content's
       natural size. */
    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* Bokeh wraps the root layout in an anonymous div under <body>.
       Stretch ONLY those wrappers, not other body-level children
       (notably the tooltip popup, which Bokeh also appends as a
       body > div — a blanket `body > div { height: 100% }` would
       force the tooltip to span the entire viewport height).
       :has() picks out body > div whose immediate child is a Bokeh
       layout (bk-Row or bk-Column). */
    body > div:has(> .bk-Row),
    body > div:has(> .bk-Column) {
      height: 100% !important;
    }
    /* Inside the wrapper, the Bokeh layout itself fills too. */
    body > div > .bk-Row,
    body > div > .bk-Column {
      height: 100% !important;
    }
    /* Hover-tooltip slim-down. Bokeh's default tooltip has generous
       padding and large font; we only override padding + font-size +
       max width here. Critically we do NOT set background / box-shadow
       (those override Bokeh's internal arrow/connector styling and
       end up rendering the tooltip as a giant white column). */
    .bk-tooltip,
    .bk-Tooltip,
    .bk-tooltip-inner,
    .bk-Tooltip-inner {
      padding: 2px 6px !important;
      font-size: 11px !important;
      line-height: 1.3 !important;
      max-width: 340px !important;
    }
    .bk-tooltip-row-label, .bk-tooltip-row-value,
    .bk-Tooltip-row-label, .bk-Tooltip-row-value {
      font-size: 11px !important;
      padding: 0 2px !important;
    }
